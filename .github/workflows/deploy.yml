name: Deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: "staging"
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - id: meta
        name: Compute image tag
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          BRANCH=${GITHUB_REF_NAME}
          echo "image_tag=${BRANCH}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fibraos:${{ steps.meta.outputs.image_tag }}
            ghcr.io/${{ github.repository_owner }}/fibraos:${{ github.ref_name }}
            ${{ github.ref_name == 'main' && format('ghcr.io/{0}/fibraos:latest', github.repository_owner) || '' }}
          build-args: |
            IMAGE_TAG=${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select target
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "host=${{ secrets.PROD_SSH_HOST }}" >> $GITHUB_OUTPUT
            echo "env_url=https://app.fibraos.com" >> $GITHUB_OUTPUT
          else
            echo "host=${{ secrets.STAGING_SSH_HOST }}" >> $GITHUB_OUTPUT
            echo "env_url=https://app.staging.fibraos.com" >> $GITHUB_OUTPUT
          fi

      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ steps.target.outputs.host }}
          username: deploy
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/fibraos

            echo "==> Pull source code (for Caddyfile, compose, scripts)"
            git fetch --all
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            echo "==> Set IMAGE_TAG + GITHUB_OWNER for compose"
            export IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}
            export GITHUB_OWNER=${{ github.repository_owner }}

            echo "==> Capture previous tag for rollback"
            docker image tag ghcr.io/${GITHUB_OWNER}/fibraos:previous \
              ghcr.io/${GITHUB_OWNER}/fibraos:rollback-$(date +%s) 2>/dev/null || true
            docker image tag ghcr.io/${GITHUB_OWNER}/fibraos:${{ github.ref_name }} \
              ghcr.io/${GITHUB_OWNER}/fibraos:previous 2>/dev/null || true

            echo "==> Login GHCR"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "==> Pull new image"
            docker compose -f docker-compose.prod.yml pull app worker

            echo "==> Run migrations"
            docker compose -f docker-compose.prod.yml run --rm \
              -e DATABASE_URL="$DATABASE_URL" \
              app pnpm db:migrate || echo "migrate retcode=$?"

            echo "==> Rolling update app + worker"
            docker compose -f docker-compose.prod.yml up -d --no-deps --build app worker caddy

            echo "==> Prune dangling images"
            docker image prune -f

      - name: Health check
        run: |
          echo "Waiting 20s for services…"
          sleep 20
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 10 "${{ steps.target.outputs.env_url }}/api/health" >/dev/null; then
              echo "✓ Healthcheck OK"
              exit 0
            fi
            echo "Retry $i/5…"
            sleep 10
          done
          echo "✗ Healthcheck failed, triggering rollback"
          exit 1

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ steps.target.outputs.host }}
          username: deploy
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euxo pipefail
            cd /opt/fibraos
            export GITHUB_OWNER=${{ github.repository_owner }}
            export IMAGE_TAG=previous
            docker compose -f docker-compose.prod.yml up -d --no-deps app worker
            echo "Rollback to :previous completed"

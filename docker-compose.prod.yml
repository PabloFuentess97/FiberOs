# FibraOS · producción Hetzner (§31.4 del blueprint).
# Copiar a /opt/fibraos/ en el servidor + .env.production con permisos 600.
name: fibraos

networks:
  fibraos_net:
    driver: bridge

volumes:
  pgdata:
    driver: local
    driver_opts: { type: none, o: bind, device: /var/lib/fibraos/pgdata }
  redisdata:
    driver: local
    driver_opts: { type: none, o: bind, device: /var/lib/fibraos/redisdata }
  caddydata:
    driver: local
    driver_opts: { type: none, o: bind, device: /var/lib/fibraos/caddydata }
  caddyconfig:
    driver: local
    driver_opts: { type: none, o: bind, device: /var/lib/fibraos/caddyconfig }

services:
  # ============ Postgres 16 + PostGIS 3.4 ============
  postgres:
    image: postgis/postgis:16-3.4
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - wal_compression=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 4G, cpus: "2.0" }
    networks: [fibraos_net]

  # ============ PgBouncer en session mode (crítico para SET LOCAL) ============
  pgbouncer:
    image: edoburu/pgbouncer:1.23.1
    restart: always
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      POOL_MODE: session
      MAX_CLIENT_CONN: "500"
      DEFAULT_POOL_SIZE: "50"
      ADMIN_USERS: ${POSTGRES_USER}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [fibraos_net]

  # ============ Redis con AOF ============
  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { memory: 1G, cpus: "1.0" }
    networks: [fibraos_net]

  # ============ Next.js app × 2 ============
  app:
    image: ghcr.io/${GITHUB_OWNER}/fibraos:${IMAGE_TAG:-latest}
    restart: always
    env_file: .env.production
    environment:
      WORKER_MODE: "false"
      NODE_ENV: production
    depends_on:
      pgbouncer: { condition: service_started }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 2
      resources:
        limits: { memory: 1G, cpus: "1.0" }
    networks: [fibraos_net]

  # ============ Worker BullMQ ============
  worker:
    image: ghcr.io/${GITHUB_OWNER}/fibraos:${IMAGE_TAG:-latest}
    restart: always
    env_file: .env.production
    environment:
      WORKER_MODE: "true"
      NODE_ENV: production
    command: ["node", "--experimental-strip-types", "lib/queues/worker-entrypoint.ts"]
    depends_on:
      pgbouncer: { condition: service_started }
      redis: { condition: service_healthy }
    deploy:
      replicas: 1
      resources:
        limits: { memory: 1G, cpus: "1.0" }
    networks: [fibraos_net]

  # ============ Caddy reverse proxy + TLS ============
  caddy:
    build:
      context: ./infra/caddy
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    environment:
      CLOUDFLARE_DNS_API_TOKEN: ${CLOUDFLARE_DNS_API_TOKEN}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN}
    depends_on:
      - app
    networks: [fibraos_net]

  # ============ Backup sidecar (pg_dump + age + rclone R2) ============
  backup:
    image: alpine:3.20
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - ./infra/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "apk add --no-cache postgresql16-client age rclone busybox-suid tzdata &&
       chmod +x /backup.sh &&
       echo '0 3 * * * /backup.sh' | crontab - &&
       crond -f -L /dev/stdout"
    depends_on:
      postgres: { condition: service_healthy }
    networks: [fibraos_net]
